application:
  name: Spring DDD Starter
  version: 0.0.1-SNAPSHOT
security:
  frontend-success: /api
  # No users are defined by default: any profile other than `dev` must supply its own, e.g. through
  # SECURITY_USERS_0_NAME / SECURITY_USERS_0_PASSWORD / SECURITY_USERS_0_ROLES environment variables.
  users:
spring:
  application:
    name: Spring DDD Starter
  profiles:
    # `dev` applies only when no profile is set explicitly, so the demo users below stay a local-development
    # convenience. Starting with SPRING_PROFILES_ACTIVE=prod (or any other profile) drops them entirely.
    default: dev
  jpa:
    hibernate:
      # Fail fast if the JPA mapping (column names derived by ValueObjectAwareImplicitNamingStrategy)
      # drifts from the hand-written Flyway schema.
      ddl-auto: validate
      naming:
        implicit-strategy: com.example.app._infrastructure.persistence.ValueObjectAwareImplicitNamingStrategy
  modulith:
    events:
      republish-outstanding-events-on-restart: true
springdoc:
  swagger-ui:
    # CSRF is disabled in SecurityConfiguration (stateless API, HTTP Basic), so Swagger UI must not send a
    # CSRF token either - enabling it here would only pretend to a protection the server does not apply.
    csrf:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: [health,info]
---
# Local development only. Active by default via `spring.profiles.default` above; never active once an explicit
# profile is set. These are demo credentials - they must not be the way any deployed instance authenticates.
spring:
  config:
    activate:
      on-profile: dev
security:
  users:
    - name: user
      password: 1234
      roles: USER
    - name: admin
      password: 1234
      roles: [USER, ADMIN]
